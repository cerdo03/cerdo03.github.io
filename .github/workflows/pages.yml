name: Publish journal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - uses: actions/configure-pages@v6
      - name: Prepare public website files
        run: node scripts/prepare-site.mjs _site "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Let the uploaded artifact register
        run: sleep 15
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - uses: actions/deploy-pages@v5
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
